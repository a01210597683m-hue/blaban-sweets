name: Android TWA test build (temporary signing key)

on:
  push:
    branches:
      - android-twa-test-build
    paths:
      - '.github/workflows/android-twa-test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-test-build-prompt-match-v2
  cancel-in-progress: true

jobs:
  test-build:
    name: Build non-release TWA artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          LICENSE_ACCEPTANCES="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --licenses <<< "$LICENSE_ACCEPTANCES" >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.1.0"
          if [ ! -e "$SDK_ROOT/bin" ]; then ln -s "$SDKMANAGER_DIR" "$SDK_ROOT/bin"; fi

      - name: Install Bubblewrap and prompt automation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y expect
          npm install --global @bubblewrap/cli
          mkdir -p "$HOME/.bubblewrap"
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.HOME+"/.bubblewrap/config.json", JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME},null,2)+"\n")'
          bubblewrap doctor

      - name: Generate isolated TWA project with temporary test key
        shell: bash
        run: |
          set -euo pipefail
          # A fresh, disposable signing key is generated for this CI run only.
          TEST_KEY_PASSWORD="$(openssl rand -hex 16)"
          export TEST_KEY_PASSWORD
          mkdir -p android-twa
          cat > /tmp/init-bubblewrap.exp <<'EXPECT'
          set timeout 180
          # Fail immediately on a prompt mismatch. Expect otherwise returns "timeout" and the
          # script would keep sending answers into the wrong prompts, corrupting the setup.
          expect_before timeout { puts stderr "ERROR: Timed out waiting for the expected Bubblewrap prompt; aborting safely."; exit 124 }
          set pass $env(TEST_KEY_PASSWORD)
          set icon "https://raw.githubusercontent.com/mirnaselect-droid/blaban-sweets/android-twa-test-build/icons/blaban-icon-512.png"
          spawn npx --yes @bubblewrap/cli init --manifest=https://blaban-sweets.pages.dev/manifest.webmanifest --directory=android-twa

          # Answer each prompt in order. Do not use a catch-all matcher: Inquirer redraws
          # old prompts in the terminal and broad matchers can send an answer to the wrong field.
          expect -nocase -re {\?[^[:newline:]]{0,40}Domain:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}URL path:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Application name:}
          send "BLABAN-SWEETS\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Short name:}
          send "BLABAN\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Application ID:}
          send "com.blabansweets.app\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Starting version code for the new app version:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Display mode:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Orientation:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Status bar color:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Splash screen color:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Icon URL:}
          send "$icon\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Maskable icon URL:}
          send "$icon\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Include app shortcuts\?}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Monochrome icon URL:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Include support for Play Billing\?}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Request geolocation permission\?}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Key store location:}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Key name:}
          send "android\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Do you want to create one now\?}
          send "\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}First and Last names}
          send "BLABAN-SWEETS\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Organizational Unit}
          send "Apps\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Organization}
          send "BLABAN-SWEETS\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Country \(2 letter code\)}
          send "EG\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Password for the Key Store:}
          send "$pass\r"
          expect -nocase -re {\?[^[:newline:]]{0,40}Password for the Key:}
          send "$pass\r"
          expect eof
          catch wait result
          exit [lindex $result 3]
          EXPECT
          expect -f /tmp/init-bubblewrap.exp
          test -f android-twa/twa-manifest.json
          node -e 'const m=require("./android-twa/twa-manifest.json"); if(m.packageId!=="com.blabansweets.app") throw new Error("Unexpected packageId: "+m.packageId); if(m.host!=="blaban-sweets.pages.dev") throw new Error("Unexpected TWA host: "+m.host); if(m.startUrl!=="/") throw new Error("Unexpected start URL: "+m.startUrl); console.log("TWA identity checks passed:",m.packageId,m.host,m.startUrl)'
          echo "TEST_KEY_PASSWORD=$TEST_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK and AAB for testing only
        working-directory: android-twa
        run: |
          set -euo pipefail
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$TEST_KEY_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$TEST_KEY_PASSWORD"
          npx --yes @bubblewrap/cli build --skipPwaValidation
          mkdir -p ../test-artifacts
          find . -maxdepth 3 -type f \\( -name '*.apk' -o -name '*.aab' \\) -print -exec cp {} ../test-artifacts/ \;
          test -n "$(find ../test-artifacts -maxdepth 1 -type f \\( -name '*.apk' -o -name '*.aab' \\) -print -quit)"
          (cd ../test-artifacts && sha256sum *.apk *.aab 2>/dev/null || true) > SHA256SUMS.txt
          printf '%s\n' 'TEST BUILD ONLY — signed with a temporary CI key; not suitable for Google Play release.' > ../test-artifacts/BUILD-NOT-FOR-RELEASE.txt

      - name: Upload test APK/AAB (no keystore)
        uses: actions/upload-artifact@v5
        with:
          name: blaban-sweets-android-test-build
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 7
