name: Android TWA preflight

on:
  push:
    branches:
      - main
      - android-twa-scaffold
    paths:
      - '.github/workflows/android-twa-preflight.yml'
      - 'ANDROID-TWA-BUILD.md'
      - 'manifest.webmanifest'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa-preflight:
    name: Check isolated preview PWA readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 17 for non-interactive Bubblewrap validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK without the removed legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          LICENSE_ACCEPTANCES="$(printf 'y\\n%.0s' {1..100})"
          "$SDKMANAGER" --licenses <<< "$LICENSE_ACCEPTANCES" >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.1.0"
          # Bubblewrap expects sdkmanager at $ANDROID_HOME/bin/sdkmanager on modern SDK layouts.
          if [ ! -e "$SDK_ROOT/bin" ]; then ln -s "$SDKMANAGER_DIR" "$SDK_ROOT/bin"; fi

      - name: Configure Bubblewrap without interactive prompts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          mkdir -p "$HOME/.bubblewrap"
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.HOME+"/.bubblewrap/config.json", JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME},null,2)+"\n")'
          # Retry transient npm registry/network failures before failing the preflight.
          doctor_ok=false
          for attempt in 1 2 3; do
            echo "Bubblewrap doctor attempt $attempt/3"
            if npx --yes --fetch-retries=3 --fetch-timeout=60000 @bubblewrap/cli doctor; then
              doctor_ok=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Bubblewrap doctor did not complete; retrying after a short wait."
              sleep 15
            fi
          done
          if [ "$doctor_ok" != true ]; then
            echo "::error::Bubblewrap doctor failed after 3 attempts. Check npm registry/network logs."
            exit 1
          fi

      - name: Verify isolated preview manifest is reachable and has expected basics
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://android-twa-scaffold.blaban-sweets.pages.dev/manifest.webmanifest';
          const expectedName = 'BLABAN-SWEETS | حلو ب لبن';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let response;
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                response = await fetch(url, { redirect: 'follow' });
                console.log('Attempt', attempt, 'HTTP', response.status, 'content-type', response.headers.get('content-type'));
                if (response.ok) break;
              } catch (error) {
                lastError = error;
              }
              await sleep(5000);
            }
            if (!response || !response.ok) throw new Error(`Preview manifest unavailable after retries: ${lastError || response?.status}`);
            console.log('Manifest URL after redirects:', response.url);
            const body = await response.text();
            if (!/json/i.test(response.headers.get('content-type') || '') && !body.trimStart().startsWith('{')) {
              throw new Error('Preview manifest URL returned HTML or another non-JSON response.');
            }
            const manifest = JSON.parse(body);
            const errors = [];
            if (manifest.name !== expectedName) errors.push(`Unexpected name: ${manifest.name}`);
            if (manifest.start_url !== '/') errors.push(`Unexpected start_url: ${manifest.start_url}`);
            if (manifest.scope !== '/') errors.push(`Unexpected scope: ${manifest.scope}`);
            if (manifest.dir !== 'rtl') errors.push(`Expected dir=rtl, got: ${manifest.dir}`);
            if (manifest.display !== 'standalone') errors.push(`Expected display=standalone, got: ${manifest.display}`);
            if (!Array.isArray(manifest.icons) || !manifest.icons.some(i => i.sizes === '192x192') || !manifest.icons.some(i => i.sizes === '512x512')) {
              errors.push('Manifest must include 192x192 and 512x512 icons');
            }
            if (errors.length) {
              console.error(errors.join('\\n'));
              process.exit(1);
            }
            console.log('Preview manifest basics passed. NOTE: this is a preview origin, not the final Play Store origin.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Run Bubblewrap PWA validation against isolated preview
        id: bubblewrap_validation
        shell: bash
        run: |
          set -uo pipefail
          : > bubblewrap-validation.log
          for attempt in 1 2 3; do
            echo "Bubblewrap validation attempt $attempt/3" | tee -a bubblewrap-validation.log
            if npx --yes @bubblewrap/cli validate --url=https://android-twa-scaffold.blaban-sweets.pages.dev 2>&1 | tee /tmp/bubblewrap-validation-attempt.log | tee -a bubblewrap-validation.log; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "Bubblewrap validation completed successfully." | tee -a bubblewrap-validation.log
              exit 0
            fi
            if grep -Eqi 'status 429|HTTP 429|Too Many Requests' /tmp/bubblewrap-validation-attempt.log; then
              if [ "$attempt" -lt 3 ]; then
                echo "Google PageSpeed rate-limited this attempt; waiting 30 seconds before retry." | tee -a bubblewrap-validation.log
                sleep 30
                continue
              fi
              echo "PageSpeed remained rate-limited after 3 attempts; SDK and manifest checks passed, but the external PageSpeed-based validation could not complete." | tee -a bubblewrap-validation.log
              echo "status=unverified_rate_limited" >> "$GITHUB_OUTPUT"
              echo "::warning::Google PageSpeed returned HTTP 429 after 3 attempts. Android SDK setup and manifest checks passed, but Bubblewrap's PageSpeed-based validation remains unverified."
              exit 0
            fi
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "Bubblewrap validation failed for a reason other than rate limiting; not retrying automatically." | tee -a bubblewrap-validation.log
            exit 1
          done
          exit 1

      - name: Summarize Android TWA preflight result
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.bubblewrap_validation.outcome }}
          VALIDATION_STATUS: ${{ steps.bubblewrap_validation.outputs.status }}
        run: |
          {
            echo "## Android TWA preflight result"
            echo
            echo "- Android SDK setup and preview manifest checks are separate from Bubblewrap/PageSpeed validation."
            case "$VALIDATION_STATUS" in
              passed)
                echo "- **Bubblewrap validation:** passed."
                ;;
              unverified_rate_limited)
                echo "- **Bubblewrap validation:** unverified — Google PageSpeed returned HTTP 429 after retries. This is not a full validation pass."
                ;;
              failed)
                echo "- **Bubblewrap validation:** failed. Review the workflow logs."
                ;;
              *)
                echo "- **Bubblewrap validation:** outcome was \`$VALIDATION_OUTCOME\`; inspect logs for details."
                ;;
            esac
            echo
            echo "This workflow is a preflight check only. It does not build or sign an APK/AAB and does not publish to Google Play."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-twa-preflight-report
          path: bubblewrap-validation.log
          if-no-files-found: warn
          retention-days: 7
